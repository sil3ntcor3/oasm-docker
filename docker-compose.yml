services:
  console:
    container_name: oasm-console
    image: sil3ntcor3/myoasm-console:${IMAGE_TAG:-dev}
    platform: linux/amd64
    networks:
      - oasm
    ports:
      - '9090:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: on-failure
    depends_on:
      core-api:
        condition: service_healthy

  core-api:
    container_name: oasm-api
    image: sil3ntcor3/myoasm-api:${IMAGE_TAG:-dev}
    platform: linux/amd64
    networks:
      - oasm
    environment:
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET to a generated secret of at least 32 characters}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:9090}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_USERNAME=${POSTGRES_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-open_asm}
      - POSTGRES_SSL=${POSTGRES_SSL:-false}
      - PORT=${PORT:-6276}
      - OASM_CLOUD_APIKEY=${WORKER_ENROLLMENT_TOKEN:?Set WORKER_ENROLLMENT_TOKEN to a secret of at least 32 characters}
      - REDIS_URL=${REDIS_URL:-redis://:open_asm@redis:6379/0}
      - GEO_IP_URL=geo-ip-database:4360
      - RUSTFS_ENDPOINT=${RUSTFS_ENDPOINT:-http://rustfs:9000}
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-rustfsadmin}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-rustfssecret}
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      geo-ip-database:
        condition: service_healthy
      # Object storage must be reachable before the API boots. The API
      # provisions its buckets on startup, and a job result is written to
      # storage before anything else happens to it, so an API that starts first
      # cannot accept results until storage catches up.
      rustfs:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:${PORT:-6276}/api/health']
      interval: 1s
      timeout: 60s
      retries: 10

  admin-provisioner:
    profiles: ['setup']
    image: sil3ntcor3/myoasm-api:${IMAGE_TAG:-dev}
    platform: linux/amd64
    networks:
      - oasm
    environment:
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET to a generated secret of at least 32 characters}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:9090}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_USERNAME=${POSTGRES_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-open_asm}
      - POSTGRES_SSL=${POSTGRES_SSL:-false}
      - REDIS_URL=${REDIS_URL:-redis://:open_asm@redis:6379/0}
    command: ['node', 'dist/provision-admin.js']
    restart: 'no'
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      migration:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  rustfs:
    container_name: oasm-rustfs
    image: rustfs/rustfs:latest
    networks:
      - oasm
    environment:
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY:-rustfsadmin}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY:-rustfssecret}
    volumes:
      - rustfs-data:/data:rw
    restart: 'always'
    # Readiness gate for core-api. Deliberately NOT `curl -f`: an unauthenticated
    # request to the S3 root answers 403, which -f treats as a failure even
    # though it proves the service is up and serving. Plain curl exits 0 on any
    # HTTP response and non-zero only when the connection itself fails, which is
    # exactly the distinction we need here.
    healthcheck:
      test: ['CMD', 'curl', '-s', '-o', '/dev/null', 'http://localhost:9000']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command: ['/data']

  migration:
    container_name: oasm-migration
    image: sil3ntcor3/myoasm-api:${IMAGE_TAG:-dev}
    platform: linux/amd64
    networks:
      - oasm
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_USERNAME=${POSTGRES_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-open_asm}
      - POSTGRES_SSL=${POSTGRES_SSL:-false}
      - REDIS_URL=${REDIS_URL:-redis://:open_asm@redis:6379/0}
    command: sh -c "npx typeorm migration:run -d dist/database/database-config.js"
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  oasm-worker:
    image: sil3ntcor3/myoasm-worker:${IMAGE_TAG:-dev}
    platform: linux/amd64
    environment:
      - WORKER_API_KEY=${WORKER_ENROLLMENT_TOKEN:?Set WORKER_ENROLLMENT_TOKEN to a secret of at least 32 characters}
      - WORKER_GRPC_HOST=core-api
      - WORKER_GRPC_PORT=16276
      - WORKER_MAX_CONCURRENCY=10
      - WORKER_TOOL_PATH=/app/oasm-tools
      - SUBFINDER_PROVIDER_CONFIG=/run/secrets/subfinder-provider-config.yaml
    volumes:
      - type: volume
        target: /app/oasm-tools
      - type: bind
        source: ${SUBFINDER_PROVIDER_CONFIG_PATH:-./provider-config.yaml}
        target: /run/secrets/subfinder-provider-config.yaml
        read_only: true
        bind:
          create_host_path: false
    networks:
      - oasm
    restart: on-failure
    depends_on:
      core-api:
        condition: service_healthy
    deploy:
      mode: replicated
      replicas: 3

  postgres:
    container_name: oasm-postgres
    image: postgres:17
    restart: on-failure
    environment:
      - POSTGRES_USER=${POSTGRES_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-open_asm}
    volumes:
      - pgdata:/var/lib/postgresql/data:rw
    networks:
      - oasm
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER:-postgres}" -d "$${POSTGRES_DB:-open_asm}"']
      interval: 1s
      timeout: 5s
      retries: 10

  redis:
    container_name: oasm-redis
    image: redis:alpine
    restart: on-failure
    networks:
      - oasm
    volumes:
      - redis-data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --save 3600 1 --save 30 500 --save 300 100 --save 60 10000
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1500M
        reservations:
          cpus: '0.5'
          memory: 512M

  geo-ip-database:
    container_name: geo-ip-database
    image: ghcr.io/l1ttps/geoip-proxy:latest
    platform: linux/amd64
    networks:
      - oasm
    restart: on-failure
    volumes:
      - geoip-data:/app/data:rw
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4360']
      interval: 1s
      timeout: 60s
      retries: 10

volumes:
  pgdata:
  redis-data:
  geoip-data:
  rustfs-data:

networks:
  oasm:
    driver: bridge
    name: oasm_net
